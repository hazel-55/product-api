name: Test Product API Docker Compose

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-compose:
    runs-on: ubuntu-24.04

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v6

      - name: Cài Node.js để chạy bài test
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Chuẩn bị cấu hình trên máy ảo
        run: |
          printf 'PORT=3000\nMONGO_URI=mongodb://nammongodb:27017/product_db\n' > .env
          docker volume create nammongodb-data
          docker compose config -q

      - name: Build và chạy API cùng MongoDB
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Kiểm tra healthcheck và CRUD
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const base = 'http://127.0.0.1:3000';
          const pid = 'CI-PROD-001';

          const health = await fetch(`${base}/health`);
          assert.equal(health.status, 200);
          assert.equal((await health.json()).database, 'connected');

          const create = await fetch(`${base}/api/products`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              pid,
              pname: 'San pham CI',
              price: 100000,
              quantity: 2
            })
          });
          assert.equal(create.status, 201);

          const list = await fetch(`${base}/api/products`);
          assert.equal(list.status, 200);
          assert.ok((await list.json()).some(product => product.pid === pid));

          const read = await fetch(`${base}/api/products/${pid}`);
          assert.equal(read.status, 200);
          assert.equal((await read.json()).pname, 'San pham CI');

          const update = await fetch(`${base}/api/products/${pid}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              pname: 'San pham da sua',
              price: 120000,
              quantity: 3
            })
          });
          assert.equal(update.status, 200);
          assert.equal((await update.json()).price, 120000);

          const remove = await fetch(`${base}/api/products/${pid}`, {
            method: 'DELETE'
          });
          assert.equal(remove.status, 200);

          const afterDelete = await fetch(`${base}/api/products/${pid}`);
          assert.equal(afterDelete.status, 404);

          console.log('CI Compose đạt: healthcheck và đủ Create, Read, Update, Delete');
          NODE

      - name: Đăng nhập Docker Hub
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Đẩy image đã kiểm tra lên Docker Hub
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE_NAME="${DOCKERHUB_USERNAME}/product-api"

          docker tag product-api:1.0 "${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker tag product-api:1.0 "${IMAGE_NAME}:latest"

          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"

      - name: Hiện log nếu có lỗi
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=100

      - name: Dừng các container
        if: always()
        run: docker compose down

  deploy-local:
    name: Triển khai lên Docker Engine local
    needs: test-compose
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, windows, x64, product-api-local]
    timeout-minutes: 10

    concurrency:
      group: product-api-local-deploy
      cancel-in-progress: false

    defaults:
      run:
        shell: powershell

    env:
      PRODUCT_API_IMAGE: hazel55/product-api:sha-${{ github.sha }}

    steps:
      - name: Lấy cấu hình triển khai
        uses: actions/checkout@v6

      - name: Kiểm tra Docker Engine
        run: |
          docker info
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Engine chưa sẵn sàng"
          }

      - name: Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Kéo image đã qua CI
        run: |
          docker compose -p product-api -f docker-compose-prod.yaml pull product-api
          if ($LASTEXITCODE -ne 0) {
            throw "Không tải được image"
          }

      - name: Cập nhật container và đợi healthcheck
        run: |
          docker compose -p product-api -f docker-compose-prod.yaml up -d --wait --wait-timeout 120
          if ($LASTEXITCODE -ne 0) {
            throw "Triển khai hoặc healthcheck thất bại"
          }

      - name: Kiểm tra API local
        run: |
          $health = Invoke-RestMethod -Uri "http://127.0.0.1:3000/health"
          if ($health.status -ne "healthy" -or $health.database -ne "connected") {
            throw "API hoặc MongoDB không healthy"
          }
          Write-Host "CD thành công: API local healthy và MongoDB connected"

      - name: Hiện log nếu lỗi
        if: failure()
        run: |
          docker compose -p product-api -f docker-compose-prod.yaml ps
          docker compose -p product-api -f docker-compose-prod.yaml logs --no-color --tail=100

      